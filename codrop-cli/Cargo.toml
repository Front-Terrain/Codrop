[package]
name = "codrop-cli"
version = "1.0.0"
edition = "2021"
authors = ["Front Terrain Inc."]
description = "Universal Adaptive Compression System CLI Tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Front-Terrain/Codrop"
readme = "../README.md"
keywords = ["compression", "cli", "cdp", "archive"]
categories = ["command-line-utilities", "compression"]

[dependencies]
libcodrop = { path = "../libcodrop", version = "1.0.0" }

[[bin]]
name = "codrop"
path = "src/main.rs"
