name: codrop
description: High-performance universal adaptive compression system for Dart and Flutter. Features lossless compression, C FFI bindings, and multi-profile codecs.
version: 1.0.0-rc.2
homepage: https://github.com/Front-Terrain/Codrop
repository: https://github.com/Front-Terrain/Codrop
issue_tracker: https://github.com/Front-Terrain/Codrop/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  ffi: ^2.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

topics:
  - compression
  - codec
  - lossless
  - ffi
