name: CI & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test:
    name: Test & Lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Check
        run: cargo fmt --all -- --check
      - name: Clippy Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test Suite
        run: cargo test --workspace --verbose

  release:
    name: Build Release Binaries
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: codrop-linux-x86_64
            asset_name: codrop-linux-x86_64.tar.gz
          - os: windows-latest
            artifact_name: codrop-windows-x86_64.exe
            asset_name: codrop-windows-x86_64.zip
          - os: macos-latest
            artifact_name: codrop-macos-universal
            asset_name: codrop-macos-universal.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --release --workspace
      - name: Package Artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/codrop.exe dist/
            cp target/release/libcodrop.dll dist/ || true
            cp include/codrop.h dist/
            7z a ${{ matrix.asset_name }} ./dist/*
          else
            cp target/release/codrop dist/
            cp target/release/libcodrop.so dist/ || cp target/release/libcodrop.dylib dist/ || true
            cp include/codrop.h dist/
            tar -czvf ${{ matrix.asset_name }} -C dist .
          fi
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Codrop ${{ github.ref_name }}"
          draft: false
          prerelease: true
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
